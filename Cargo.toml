[package]
name = "proxygen"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "*", features = ["full"] }
env_logger = "*"
clap = { version = "*", features = ["derive"] }
log = "*"
socket2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }